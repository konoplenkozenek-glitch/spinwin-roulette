<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Золотая Удача</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: sans-serif; background: #1a120b; color: #f5e6c8; margin: 0; padding: 16px; text-align: center; }
  h1 { color: #ffd700; margin: 12px 0; }
  button { padding: 14px 40px; font-size: 18px; font-weight: bold; border: none; border-radius: 10px;
           background: linear-gradient(#ffb700, #f59e0b); color: #1a120b; cursor: pointer; margin: 8px 4px; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; }
  .donate { background: linear-gradient(#22c55e, #16a34a); color: #fff; text-decoration: none; display: inline-block;
            padding: 14px 24px; border-radius: 10px; font-size: 17px; font-weight: bold; margin-top: 6px; }
  #status { min-height: 48px; font-size: 17px; margin: 10px auto; max-width: 320px; color: #ffd700; }
  .wheel { width: 90vw; max-width: 300px; margin: 6px auto; font-size: 15px; line-height: 1.4; }
  .prizes { text-align: left; max-width: 320px; margin: 14px auto; background: #241a10; border-radius: 10px; padding: 10px 14px; }
  .prizes h3 { color: #ffd700; margin: 4px 0 8px; text-align: center; }
  .prizes li { margin: 5px 0; font-size: 15px; }
</style>
</head>
<body>

<h1>🎰 Золотая Удача</h1>
<div class="wheel" id="wheel">Готов крутиться!</div>
<div id="status">100 ₽ доната = 1 крутка</div>

<button id="spin-btn" onclick="spin()">Крутить!</button>

<a class="donate" id="donate-btn" href="#" target="_blank">💎 Задонатить 100 ₽ = 1 крутка</a>

<div class="prizes">
  <h3>🎁 Что можно выиграть</h3>
  <ol id="prize-list"><li>Загрузка...</li></ol>
</div>

<script>
const tg = window.Telegram.WebApp
tg.ready()
tg.expand()

const DONATE_URL = 'https://www.donationalerts.com/r/evgeny_2026'
document.getElementById('donate-btn').href = DONATE_URL

// === Загрузка списка призов ===
async function loadPrizes() {
  const list = document.getElementById('prize-list')
  if (!list) return
  try {
    const r = await fetch('/api/prizes')
    if (!r.ok) throw new Error('HTTP ' + r.status)
    const data = await r.json()
    if (!data.ok || !Array.isArray(data.prizes)) throw new Error('bad response')
    if (data.prizes.length === 0) throw new Error('empty list')
    list.innerHTML = ''
    data.prizes.forEach(function (p) {
      const li = document.createElement('li')
      li.textContent = p.label
      if (p.color) li.style.color = p.color
      list.appendChild(li)
    })
  } catch (e) {
    console.error('loadPrizes error:', e)
    list.innerHTML = '<li style="color:#ff6b6b">Не удалось загрузить список. Перезагрузи мини-апп.</li>'
  }
}

// === Прокрутка рулетки ===
function spin() {
  const btn = document.getElementById('spin-btn')
  const wheel = document.getElementById('wheel')
  const status = document.getElementById('status')
  btn.disabled = true
  wheel.textContent = 'Крутим... 🎡'
  status.textContent = ''

  fetch('/api/spin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData: tg.initData })
  })
    .then(function (r) { return r.json() })
    .then(function (data) {
      btn.disabled = false
      if (!data.ok) {
        wheel.textContent = '🎰'
        status.textContent = data.message || data.error || 'Ошибка'
        return
      }
      wheel.textContent = '🏆 ' + data.prize.label + ' 🏆'
      status.textContent = 'Осталось круток: ' + data.spinsLeft
      tg.showAlert('Выпало: ' + data.prize.label + '!\nОсталось круток: ' + data.spinsLeft)
    })
    .catch(function () {
      btn.disabled = false
      wheel.textContent = '🎰'
      status.textContent = 'Ошибка соединения'
    })
}

loadPrizes()
</script>
</body>
</html>
