<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🎣 Посты РР4 — Золотая Удача</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --gold:#FFD700; --fire:#ff4500; --bg:#0a0703; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Unbounded',sans-serif;
    background:radial-gradient(circle at top,#2a1a08 0%,#120c04 60%,#0a0703 100%);
    background-attachment:fixed;
    color:#f5e9d0; min-height:100vh; padding:20px 12px 60px; text-align:center;
  }
  h1 { color:var(--gold); font-size:20px; text-shadow:0 0 20px rgba(255,215,0,.6);
    text-transform:uppercase; letter-spacing:1px; display:flex; justify-content:center;
    align-items:center; gap:8px; }
  .star { font-size:20px; filter:drop-shadow(0 0 8px #FFD700); }
  .sub { font-size:12px; color:#b8a878; margin-top:6px; }

  .add-btn {
    display:inline-block; margin:16px auto 6px; padding:13px 26px;
    border:none; border-radius:14px; cursor:pointer;
    background:linear-gradient(135deg,#FFD700,#FF8C00); color:#000;
    font-family:'Unbounded',sans-serif; font-size:14px; font-weight:800;
    text-transform:uppercase; box-shadow:0 0 20px rgba(255,215,0,.4);
    transition:transform .2s;
  }
  .add-btn:active { transform:scale(.95); }

  .chips { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; max-width:560px; margin:14px auto 6px; }
  .chip {
    padding:7px 13px; border-radius:20px; cursor:pointer; font-size:11px; font-weight:600;
    background:#1a120b; border:1px solid rgba(255,215,0,.45); color:#f5e9d0;
    transition:all .2s; white-space:nowrap;
  }
  .chip.on { background:var(--gold); color:#000; box-shadow:0 0 14px rgba(255,215,0,.5); }
  .chip .cnt { color:#ff8c00; font-weight:800; }
  .chip.on .cnt { color:#7a4d00; }

  .cards { max-width:560px; margin:16px auto 0; display:flex; flex-direction:column; gap:14px; }
  .card {
    text-align:left; border-radius:16px; overflow:hidden;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,215,0,.35);
    box-shadow:0 4px 24px rgba(0,0,0,.5);
  }
  .card.pending { border-color:#ff4500; }
  .card-head {
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:11px 14px; background:rgba(255,215,0,.08);
    border-bottom:1px solid rgba(255,215,0,.25);
  }
  .card-water { color:var(--gold); font-weight:800; font-size:14px; text-transform:uppercase; }
  .card-date { font-size:10px; color:#8a7a55; white-space:nowrap; }
  .card img { width:100%; max-height:280px; object-fit:cover; display:block; }
  .card-text { padding:12px 14px; font-size:13px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .card-foot {
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:9px 14px; border-top:1px solid rgba(255,255,255,.07); font-size:11px; color:#b8a878;
  }
  .card-foot a {
    color:#000; text-decoration:none; background:linear-gradient(135deg,#FFD700,#FF8C00);
    padding:6px 12px; border-radius:10px; font-weight:800; font-size:11px; white-space:nowrap;
  }
  .pend-label { font-size:10px; color:#ff4500; font-weight:800; text-transform:uppercase; }
  .mod-btns { display:flex; gap:6px; padding:0 14px 12px; }
  .mod-btns button { flex:1; padding:8px; border:none; border-radius:10px; font-family:'Unbounded',sans-serif; font-size:11px; font-weight:800; cursor:pointer; }
  .ok-btn { background:#3ddc84; color:#000; }
  .del-btn { background:#ef4444; color:#fff; }
  .empty { color:#8a7a55; font-size:13px; padding:30px 0; }

  /* Модалка добавления */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.75); display:none;
    justify-content:center; align-items:flex-start; padding:30px 14px; z-index:50; overflow-y:auto; }
  .overlay.on { display:flex; }
  .modal {
    width:100%; max-width:420px; background:#170f06; border:1.5px solid var(--gold);
    border-radius:18px; padding:18px; text-align:left; box-shadow:0 0 40px rgba(255,215,0,.25);
  }
  .modal h3 { color:var(--gold); text-align:center; font-size:15px; margin-bottom:12px; }
  .modal label { display:block; font-size:11px; color:#b8a878; margin:10px 0 4px; }
  .modal input, .modal select, .modal textarea {
    width:100%; background:#0f0a04; border:1px solid rgba(255,215,0,.4); border-radius:10px;
    padding:10px; color:#fff; font-family:'Unbounded',sans-serif; font-size:12px; outline:none;
  }
  .modal textarea { min-height:90px; resize:vertical; }
  .modal .btns { display:flex; gap:8px; margin-top:14px; }
  .modal .btns button { flex:1; padding:11px; border:none; border-radius:12px;
    font-family:'Unbounded',sans-serif; font-size:12px; font-weight:800; cursor:pointer; }
  .save { background:linear-gradient(135deg,#FFD700,#FF8C00); color:#000; }
  .cancel { background:#333; color:#fff; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#000; padding:10px 18px; border-radius:12px;
    font-weight:800; font-size:12px; display:none; z-index:99; max-width:90%; }
</style>
</head>
<body>

<h1><span class="star">⭐</span>Посты РР4<span class="star">⭐</span></h1>
<div class="sub">Рыбацкие посты от зрителей Золотой Удачи 🐟</div>

<button class="add-btn" onclick="openForm()">＋ Добавить пост</button>

<div class="chips" id="chips"></div>
<div class="cards" id="cards"><div class="empty">Загружаем...</div></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>📝 Новый пост</h3>
    <label>Водоём</label>
    <select id="fWater"></select>
    <label>Твой ник (как покажем в посте)</label>
    <input id="fAuthor" maxlength="40" placeholder="Например: Рыбак_Про">
    <label>Расскажи про рыбалку</label>
    <textarea id="fText" maxlength="1200" placeholder="Где ловил, на что, что поймал..."></textarea>
    <label>Ссылка на фото (необязательно)</label>
    <input id="fPhoto" placeholder="https://... картинка">
    <label>Ссылка на канал/пост (необязательно)</label>
    <input id="fLink" placeholder="https://t.me/...">
    <div class="btns">
      <button class="cancel" onclick="closeForm()">Отмена</button>
      <button class="save" onclick="submitPost()">Отправить</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const WATERS = ['оз. Комариное','оз. Лосиное','р. Вьюнок','оз. Старый Острог','р. Белая',
  'оз. Кугор','оз. Медвежье','р. Волхов','р. Северский Донец','р. Сура','Ладожское оз.',
  'оз. Янтарное','р. Ахтуба','оз. Медное','р. Нижняя Тунгуска','р. Яма','Норвежское море'];
const ADMIN_KEY = new URLSearchParams(location.search).get('key') || '';
let POSTS = [], filter = '';

function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.style.display='block'; setTimeout(()=>el.style.display='none',3500); }
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function timeStr(ts){ if(!ts) return ''; const d=new Date(ts);
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }

function renderChips(){
  const box = document.getElementById('chips');
  const counts = {};
  POSTS.forEach(p => { counts[p.water] = (counts[p.water]||0)+1; });
  let html = '<div class="chip'+(filter?'':' on')+'" onclick="setFilter(\'\')">Все <span class="cnt">'+POSTS.length+'</span></div>';
  WATERS.forEach(w => {
    html += '<div class="chip'+(filter===w?' on':'')+'" onclick="setFilter(\''+w.replace(/'/g,"\\'")+'\')">'+
      esc(w)+(counts[w]?' <span class="cnt">'+counts[w]+'</span>':' ⏳')+'</div>';
  });
  box.innerHTML = html;
}

function renderCards(){
  const box = document.getElementById('cards');
  const list = POSTS.filter(p => !filter || p.water === filter);
  if (!list.length) { box.innerHTML = '<div class="empty">Постов пока нет — будь первым! 🎣</div>'; return; }
  box.innerHTML = list.map(p =>
    '<div class="card'+(p.status===0?' pending':'')+'">'+
    '<div class="card-head"><span class="card-water">'+esc(p.water)+'</span>'+
    (p.status===0 ? '<span class="pend-label">на проверке</span>' : '<span class="card-date">'+timeStr(p.created_at)+'</span>')+'</div>'+
    (p.photo_url ? '<img src="'+esc(p.photo_url)+'" alt="" onerror="this.style.display=\'none\'">' : '')+
    (p.text ? '<div class="card-text">'+esc(p.text)+'</div>' : '')+
    '<div class="card-foot"><span>👤 '+esc(p.author||'Аноним')+'</span>'+
    (p.link ? '<a href="'+esc(p.link)+'" target="_blank">📖 Открыть</a>' : '<span></span>')+'</div>'+
    (ADMIN_KEY && p.status===0 ?
      '<div class="mod-btns"><button class="ok-btn" onclick="mod('+p.id+',\'approve\')">✅ Опубликовать</button>'+
      '<button class="del-btn" onclick="mod('+p.id+',\'delete\')">🗑 Удалить</button></div>' : '')+
    '</div>').join('');
}

function setFilter(w){ filter = w; renderChips(); renderCards(); }

async function load(){
  try {
    const r = await fetch('/api/posts' + (ADMIN_KEY ? '?key='+encodeURIComponent(ADMIN_KEY) : ''));
    const j = await r.json();
    if (j.ok) { POSTS = j.posts; renderChips(); renderCards(); }
  } catch(e){}
}

function openForm(){
  const sel = document.getElementById('fWater');
  sel.innerHTML = WATERS.map(w=>'<option>'+w+'</option>').join('');
  document.getElementById('overlay').classList.add('on');
}
function closeForm(){ document.getElementById('overlay').classList.remove('on'); }

async function submitPost(){
  const body = {
    water: document.getElementById('fWater').value,
    author: document.getElementById('fAuthor').value,
    text: document.getElementById('fText').value,
    photoUrl: document.getElementById('fPhoto').value,
    link: document.getElementById('fLink').value
  };
  const r = await fetch('/api/posts/add', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const j = await r.json();
  closeForm();
  document.getElementById('fText').value=''; document.getElementById('fPhoto').value=''; document.getElementById('fLink').value='';
  if (j.ok) toast('Отправлено! Админ проверит и опубликует 🎣');
  else if (j.error==='empty') toast('Напиши текст или добавь фото');
  else if (j.error==='bad_photo') toast('Ссылка на фото должна начинаться с https://');
  else if (j.error==='bad_link') toast('Ссылка должна начинаться с https://');
  else toast('Ошибка, попробуй ещё раз');
}

async function mod(id, action){
  await fetch('/api/posts/moderate', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ key: ADMIN_KEY, id, action }) });
  toast(action==='approve' ? 'Опубликовано ✅' : 'Удалено 🗑');
  load();
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
